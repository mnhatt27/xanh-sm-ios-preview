name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    paths: ['*.swift', 'config.json', 'project.yml', '.github/workflows/build-ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for iPhone and iPad
        run: xcodebuild archive -project XanhSMPreview.xcodeproj -scheme XanhSMPreview -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/XanhSMPreview.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/dist"
          test -f "$RUNNER_TEMP/XanhSMPreview.xcarchive/Products/Applications/XanhSMPreview.app/Info.plist"
          cp -R "$RUNNER_TEMP/XanhSMPreview.xcarchive/Products/Applications/XanhSMPreview.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/XanhSMPreview-unsigned.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/dist/XanhSMPreview-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: XanhSMPreview-unsigned-IPA
          path: dist/XanhSMPreview-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
